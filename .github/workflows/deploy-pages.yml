# Builds the static export and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        run: npm run build:pages
        env:
          # "/yap" for https://<owner>.github.io/yap/, "" for a custom domain or user site.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check the export exists
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::No out/index.html. The build didn't run as a static export — check that next.config.ts enables output: 'export' when GITHUB_PAGES=true."
            exit 1
          fi
          echo "Exported $(find out -name index.html | wc -l) pages"

      # V2 (V2/, see V2/CLAUDE.md) is a second app served beside V1 at <base>/V2/. It has no
      # node_modules of its own: packages resolve from the root install above.
      - name: Build V2 static export
        working-directory: V2
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/V2

      - name: Put V2 inside the site
        run: |
          if [ ! -f V2/out/index.html ]; then
            echo "::error::No V2/out/index.html. V2's build didn't run as a static export — check V2/next.config.ts."
            exit 1
          fi
          rm -rf out/V2
          cp -R V2/out out/V2
          echo "V2: exported $(find out/V2 -name index.html | wc -l) pages"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
